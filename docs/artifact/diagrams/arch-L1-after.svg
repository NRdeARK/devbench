<title id="arch-L1-after-title">devbench system context, after</title>
<desc id="arch-L1-after-desc">System context after introducing devbench: one request to devbench provisions Git worktrees, opens Herdr panes and persistent sessions, launches or resumes Agent CLIs, and archives completed folders.</desc>
