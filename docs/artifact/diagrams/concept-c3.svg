<svg xmlns="http://www.w3.org/2000/svg" id="concept-c3" viewBox="0 0 1080 344" width="1080" height="344" role="img" aria-labelledby="concept-c3-title concept-c3-desc">
<title id="concept-c3-title">C3 Herdr Split: herdr-core Keeps Alive, herdr-app Shows</title>
<desc id="concept-c3-desc">devbench creates the visible workspace via herdr-app space.new, then launches persistent agents via herdr-core hc run --bg --outlive-parent with the herdr.space label so processes survive Dispatcher exit without becoming zombies (closing the pane or archiving kills them cleanly).</desc>
<defs>
  <marker id="concept-c3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker>
  <marker id="concept-c3-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker>
  <marker id="concept-c3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">C3 · HERDR-CORE KEEPS ALIVE · HERDR-APP SHOWS</text>

<!-- Connectors -->
<path d="M236 144 H324 a8 8 0 0 0 8 -8 V100 a8 8 0 0 1 8 -8 H420" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#concept-c3-arrow-new)"/>
<path d="M236 176 H324 a8 8 0 0 1 8 8 V212 a8 8 0 0 0 8 8 H420" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#concept-c3-arrow-new)"/>
<path d="M560 184 V128" fill="none" stroke="#D97757" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#concept-c3-arrow-accent)"/>
<path d="M700 220 H832" fill="none" stroke="#5E5D59" stroke-width="1.6" marker-end="url(#concept-c3-arrow)"/>

