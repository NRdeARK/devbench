<svg xmlns="http://www.w3.org/2000/svg" id="intent" viewBox="0 0 1264 552" width="1264" height="552" role="img" aria-labelledby="intent-title intent-desc">
<title id="intent-title">devbench intent swimlane</title>
<desc id="intent-desc">Swimlane overview of devbench: a user request flows through the devbench plugin (reading external user config) to auto-create a central task work folder with git worktrees and persisted work/session state, opens a workspace/tab/pane via herdr-app, runs and tracks agents (agy, claude, codex) via herdr-core (hc), reports results and native AI session IDs back to the user, and archives the entire work folder and state once done.</desc>
<defs>
  <marker id="intent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker>
  <marker id="intent-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker>
</defs>
