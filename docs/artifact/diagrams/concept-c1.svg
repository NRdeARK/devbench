<svg xmlns="http://www.w3.org/2000/svg" id="concept-c1" viewBox="0 0 1080 340" width="1080" height="340" role="img" aria-labelledby="concept-c1-title concept-c1-desc">
<title id="concept-c1-title">C1 A Work: Central folder and 1:1 Herdr workspace</title>
<desc id="concept-c1-desc">One work slug maps 1-to-1 to a central work folder containing repo worktrees and state, plus one dedicated Herdr workspace; archiving closes the workspace first, detaches clean worktrees, and moves the folder to archive.</desc>
<defs>
  <marker id="concept-c1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker>
  <marker id="concept-c1-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker>
  <marker id="concept-c1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">C1 · A WORK (CENTRAL FOLDER + 1:1 HERDR WORKSPACE)</text>

<!-- Connectors -->
<path d="M216 144 H292 a8 8 0 0 0 8 -8 V100 a8 8 0 0 1 8 -8 H384" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#concept-c1-arrow-new)"/>
<path d="M216 176 H292 a8 8 0 0 1 8 8 V212 a8 8 0 0 0 8 8 H384" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#concept-c1-arrow-new)"/>
<path d="M648 92 H732 a8 8 0 0 1 8 8 V136 a8 8 0 0 0 8 8 H824" fill="none" stroke="#D97757" stroke-width="1.8" marker-end="url(#concept-c1-arrow-accent)"/>
<path d="M648 220 H732 a8 8 0 0 0 8 -8 V184 a8 8 0 0 1 8 -8 H824" fill="none" stroke="#D97757" stroke-width="1.8" marker-end="url(#concept-c1-arrow-accent)"/>

