<title id="uc-04-title">UC-04 inspect and resume work or AI session</title>
<desc id="uc-04-desc">Sequence showing Dispatcher reading central work state, reconciling live Herdr terminals, and focusing or resuming a session in its saved cwd using its saved or user-supplied AI session ID.</desc>
