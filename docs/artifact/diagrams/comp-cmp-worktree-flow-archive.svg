<svg xmlns="http://www.w3.org/2000/svg" id="flow-archive" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="flow-archive-title flow-archive-desc">
<title id="flow-archive-title">Archive safety and Windows lock-release flow</title>
<desc id="flow-archive-desc">Flowchart of devbench archive: checks dirty/untracked worktrees first, closes Herdr space to release Windows file locks, detaches worktrees with phase checkpoints, writes frozen snapshot, and moves folder.</desc>
<defs><marker id="flow-archive-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="flow-archive-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="flow-archive-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="flow-archive-arrow-changed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B87800"/></marker><marker id="flow-archive-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="flow-archive-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5A5A"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">COMPONENT · WORKTREE MANAGER · ARCHIVE SAFETY FLOW</text>
<rect x="120" y="44" width="240" height="44" rx="22" fill="#FAF9F5"/><rect x="120" y="44" width="240" height="44" rx="22" fill="#141413" stroke="#141413" stroke-width="1.4"/><text x="240" y="71" fill="#FAF9F5" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">devbench archive &lt;slug&gt;</text>
<path d="M240 88 V132" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-archive-arrow)"/>
<polygon points="240,132 375,182 240,232 105,182" fill="#FAF9F5"/><polygon points="240,132 375,182 240,232 105,182" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/>
<text x="240" y="178" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Dirty or untracked</text><text x="240" y="196" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">worktree files?</text>
<line x1="375" y1="182" x2="549" y2="182" stroke="#B87800" stroke-width="2" marker-end="url(#flow-archive-arrow-changed)"/>
<rect x="433" y="158" width="54" height="16" rx="2" fill="#FAF9F5"/><text x="460" y="170" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="550" y="152" width="340" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="152" width="340" height="60" rx="30" fill="#FBE3B0" stroke="#B87800" stroke-width="1.4"/><text x="720" y="180" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Block archive safely</text><text x="720" y="198" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">list paths; offer --snapshot-wip</text>
<path d="M240 232 V288" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-archive-arrow)"/>
<rect x="248" y="252" width="90" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="264" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">NO (CLEAN)</text>
<polygon points="240,288 375,338 240,388 105,338" fill="#FAF9F5"/><polygon points="240,288 375,338 240,388 105,338" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/>
<text x="240" y="334" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">1:1 Herdr space</text><text x="240" y="352" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">still open?</text>
<line x1="375" y1="338" x2="549" y2="338" stroke="#1F6FA8" stroke-width="2" marker-end="url(#flow-archive-arrow-new)"/>
<rect x="433" y="314" width="54" height="16" rx="2" fill="#FAF9F5"/><text x="460" y="326" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="550" y="308" width="340" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="308" width="340" height="60" rx="30" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="720" y="336" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Close space + hc kill/rm</text><text x="720" y="354" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">release Windows file locks first</text>
<path d="M240 388 V444" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-archive-arrow)"/>
<rect x="248" y="408" width="120" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="420" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">ALREADY CLOSED</text>
<polygon points="240,444 375,494 240,544 105,494" fill="#FAF9F5"/><polygon points="240,444 375,494 240,544 105,494" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/>
<text x="240" y="490" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">worktree remove</text><text x="240" y="508" fill="#0B3D63" font-size="13" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">hits file lock?</text>
<line x1="375" y1="494" x2="549" y2="494" stroke="#B87800" stroke-width="2" marker-end="url(#flow-archive-arrow-changed)"/>
<rect x="433" y="470" width="54" height="16" rx="2" fill="#FAF9F5"/><text x="460" y="482" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="550" y="464" width="340" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="464" width="340" height="60" rx="30" fill="#FBE3B0" stroke="#B87800" stroke-width="1.4"/><text x="720" y="492" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Checkpoint archive_phase</text><text x="720" y="510" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">rerun resumes cleanly from step</text>
<path d="M240 544 V600" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-archive-arrow)"/>
<rect x="248" y="564" width="54" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="576" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">OK</text>
<rect x="50" y="600" width="380" height="60" rx="30" fill="#FAF9F5"/><rect x="50" y="600" width="380" height="60" rx="30" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="240" y="628" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Write frozen snapshot &amp; move</text><text x="240" y="646" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">state.snapshot.json + git summary -&gt; archive_root</text>
<line x1="24" y1="688" x2="976" y2="688" stroke="rgba(20,20,19,0.10)" stroke-width="1"/><text x="24" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">LEGEND</text><rect x="112" y="700" width="20" height="14" rx="2" fill="#141413" stroke="#141413"/><text x="140" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">start</text><rect x="208" y="700" width="20" height="14" rx="2" fill="#CFE4F5" stroke="#1F6FA8"/><text x="236" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new path</text><rect x="330" y="700" width="20" height="14" rx="2" fill="#FBE3B0" stroke="#B87800"/><text x="358" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">guard / warning</text>
