<svg xmlns="http://www.w3.org/2000/svg" id="uc-tree" viewBox="0 0 1160 448" width="1160" height="448" role="img" aria-labelledby="uc-tree-title uc-tree-desc">
<title id="uc-tree-title">devbench outcome to use cases tree</title>
<desc id="uc-tree-desc">Tree from Outcome O1 to five Main use cases (UC-01 through UC-05) and two Affected use cases: UC-07 via devbench plugin and UC-06 via Worktree manager.</desc>
