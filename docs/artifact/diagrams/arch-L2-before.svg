<title id="arch-L2-before-title">devbench containers, before</title>
<desc id="arch-L2-before-desc">Container view before devbench: the developer directly opens herdr-app panes, runs herdr-core commands for Agent CLIs, and manages Git repos manually with no central work state or config.</desc>
