<svg xmlns="http://www.w3.org/2000/svg" id="arch-L2-after" viewBox="0 0 1184 440" width="1184" height="440" role="img" aria-labelledby="arch-L2-after-title arch-L2-after-desc">
<title id="arch-L2-after-title">devbench containers, after</title>
<desc id="arch-L2-after-desc">Container view after devbench: devbench plugin reads gitignored User config, persists Work state, delegates work folders and git worktrees to Worktree manager, arranges panes in herdr-app, and runs Agent CLIs via herdr-core (hc).</desc>
<defs>
  <marker id="arch-L2-after-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker>
  <marker id="arch-L2-after-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">ARCHITECTURE · C4 L2 CONTAINERS · AFTER</text>

<!-- Orthogonal connectors (strictly fanned attach points, zero crossings) -->
<!-- Developer -> devbench plugin -->
<path d="M180 212 H288" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<!-- devbench plugin -> User config (up) -->
<path d="M384 180 V116" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<!-- devbench plugin -> Work state (down) -->
<path d="M384 244 V308" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<!-- devbench plugin right edge fans at y=196, 212, 228 -->
<path d="M480 196 H548 a8 8 0 0 0 8 -8 V92 a8 8 0 0 1 8 -8 H636" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<path d="M480 212 H636" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<path d="M480 228 H548 a8 8 0 0 1 8 8 V332 a8 8 0 0 0 8 8 H636" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<!-- Worktree manager -> Git repos -->
<path d="M828 84 H980" fill="none" stroke="#1F6FA8" stroke-width="2" marker-end="url(#arch-L2-after-arrow-new)"/>
<!-- herdr-core (hc) -> Agent CLIs -->
<path d="M828 340 H980" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#arch-L2-after-arrow)"/>

