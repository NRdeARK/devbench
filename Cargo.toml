[package]
name = "devbench"
version = "0.1.0"
edition = "2021"
description = "Multi-agent workspace and session orchestrator built on herdr-core (hc) and herdr-app"
license = "MIT"
repository = "https://github.com/NRdeARK/devbench"

[[bin]]
name = "devbench"
path = "src/main.rs"

[[bin]]
name = "fake_herdr"
path = "src/bin/fake_herdr.rs"
required-features = ["test-shims"]

[features]
default = []
test-shims = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
